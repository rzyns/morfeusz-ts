name: Semantic Release

on:
  # Trigger only after CI workflow completes successfully on development
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    # Ensure we only run after successful CI on development branch
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'development' }}
    runs-on: ubuntu-latest
    concurrency: semantic-release-${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Cache dictionaries
        uses: actions/cache@v4
        with:
          path: dictionaries
          key: dicts-${{ runner.os }}-${{ hashFiles('scripts/setup.ts') }}
          restore-keys: |
            dicts-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm ci --no-audit --no-fund

      - name: Setup dictionaries
        run: pnpm run setup-dicts

      - name: Build (pre-release)
        run: pnpm run build

      - name: Sanity tests (optional)
        run: pnpm test
        env:
          CI: true

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
