name: Publish to GitHub Packages (Disabled)

on:
  # Disabled under Path A (semantic-release owns publishing). Keep manual dispatch only.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: false # fully disabled; semantic-release publishes via npm plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'pnpm'

      - name: Enable corepack
        run: corepack enable

      - name: Configure npm scope
        run: |
          echo "@rzyns:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-fund --no-audit

      - name: Cache dictionaries
        uses: actions/cache@v4
        with:
          path: dictionaries
          key: dicts-${{ runner.os }}-${{ hashFiles('scripts/setup.ts') }}
          restore-keys: |
            dicts-${{ runner.os }}-

      - name: Setup dictionaries
        run: pnpm run setup-dicts

      - name: Build
        run: pnpm run build

      - name: Test before publish
        run: pnpm test

      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Package version ($PKG_VERSION) does not match tag ($TAG_VERSION)." >&2
            exit 1
          fi

      - name: Publish
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
