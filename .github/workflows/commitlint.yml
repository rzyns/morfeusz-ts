name: Commitlint

on:
  pull_request:
    types: [opened, synchronize, edited, ready_for_review]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm ci --no-audit --no-fund

      - name: Run commitlint on PR commits
        run: |
          echo "Checking commits between base and head"
          git log --format=%B ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | pnpm exec commitlint
        env:
          CI: true
