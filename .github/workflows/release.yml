name: Create Release (Disabled)

on:
  # Disabled under Path A (semantic-release owns releases). Keep manual dispatch only.
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    if: false # fully disabled; semantic-release handles builds/artifacts/releases
    name: Build addon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Enable corepack
        run: corepack enable

      - name: Cache dictionaries
        uses: actions/cache@v4
        with:
          path: dictionaries
          key: dicts-${{ runner.os }}-${{ hashFiles('scripts/setup.ts') }}
          restore-keys: |
            dicts-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm ci

      - name: Setup dictionaries (if missing)
        run: |
          if [ ! -f dictionaries/sgjp-a.dict ] && [ ! -f dictionaries/sgjp-s.dict ]; then
            pnpm run setup-dicts || echo "Dictionary setup failed; continuing to allow manual investigation.";
          fi
        shell: bash
        if: runner.os != 'Windows'

      - name: Setup dictionaries (Windows)
        run: |
          $sgjpPresent = (Test-Path 'dictionaries/sgjp-a.dict') -or (Test-Path 'dictionaries/sgjp-s.dict')
          $polimorfPresent = (Test-Path 'dictionaries/polimorf-a.dict') -or (Test-Path 'dictionaries/polimorf-s.dict')
          if (-not $sgjpPresent -or -not $polimorfPresent) {
            Write-Host 'Dictionaries missing; running setup-dicts'
            pnpm run setup-dicts
          } else {
            Write-Host 'Dictionaries already present; skipping download.'
          }
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: morfeusz2-${{ runner.os }}
          path: build/Release/morfeusz2.node
          if-no-files-found: error

  release:
    if: false # fully disabled; semantic-release creates GitHub Releases
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate last release changelog snippet
        run: npx conventional-changelog -p angular -r 1 > CHANGELOG_RELEASE.md || echo "(Changelog generation skipped)" > CHANGELOG_RELEASE.md

      - name: Append snippet to combined release notes
        run: |
          echo "## Changelog (latest release)" > RELEASE_BODY.md
          cat CHANGELOG_RELEASE.md >> RELEASE_BODY.md
          echo "\n---" >> RELEASE_BODY.md
          echo "Automatically generated. Full history in CHANGELOG.md." >> RELEASE_BODY.md

      - name: List downloaded artifacts
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: RELEASE_BODY.md
          files: |
            artifacts/**/morfeusz2.node
            CHANGELOG_RELEASE.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
