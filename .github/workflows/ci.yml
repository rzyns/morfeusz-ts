name: CI

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node: [ '24.x' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Enable corepack
        run: corepack enable

      - name: Cache node-gyp and build artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/node-gyp
            build
          key: ${{ runner.os }}-node-${{ matrix.node }}-gyp-${{ hashFiles('**/binding.gyp') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-gyp-

      - name: Cache node-gyp on Windows
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Roaming\npm-cache
            ~\AppData\Local\node-gyp\Cache
            build
          key: ${{ runner.os }}-node-${{ matrix.node }}-gyp-${{ hashFiles('**/binding.gyp') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-gyp-

      - name: Install dependencies
        run: pnpm ci

      - name: Setup dictionaries
        run: pnpm run setup-dicts

      - name: Cache dictionaries
        uses: actions/cache@v4
        with:
          path: dictionaries
          key: dicts-${{ runner.os }}-${{ hashFiles('scripts/setup.ts') }}
          restore-keys: |
            dicts-${{ runner.os }}-

      - name: Build native addon
        run: pnpm run build:native

      - name: Build TypeScript
        run: pnpm run build:ts

      - name: Run tests
        run: pnpm test

      - name: Upload addon artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morfeusz2-${{ runner.os }}
          path: build/Release/morfeusz2.node
          if-no-files-found: ignore
