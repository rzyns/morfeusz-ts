name: CI

on:
    push:
        branches: [development]
    pull_request:
        branches: [development]

jobs:
    test:
        name: Typecheck, Lint & Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # sgjp-a.dict and sgjp-s.dict are committed under morfeusz2/dict/
            # — no download from sgjp.pl required.

            - name: Typecheck
              run: pnpm run typecheck

            - name: Lint
              run: pnpm run lint

            - name: Test
              run: pnpm run test
